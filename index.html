<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Pessoal</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
:root{
    --primary:#738C9B;
    --card: rgba(0, 10, 53, 0.85); /* Adicionado canal alpha aqui para o blur funcionar melhor globalmente */
    --bg:#000000;
    --text:#C4C4C4;
}
body{
    margin:0;
    min-height:100vh;
    padding:12px;
    font-family:Audiowide,sans-serif;
    color:var(--text);

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.75)
        ),
        url("jackfrost.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

header{
    text-align:center;
    max-width:900px;
    margin:auto;
}

h1{
    color:var(--primary);
    text-shadow:
        0 0 10px var(--primary),
        0 0 20px var(--primary);
}

/* Inputs de Pesquisa */
.search-input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 12px;
    border: 1px solid var(--primary);
    background: var(--card);
    color: var(--text);
    outline: none;
    font-family: inherit;
    box-sizing: border-box;
}

.search-input:focus{
    box-shadow: 0 0 15px var(--primary);
}

details{
    max-width: 1200px;
    margin: 20px auto;
}

summary{
    cursor:pointer;
    color:var(--primary);
    font-size:1.1rem;
    margin-bottom:15px;
    text-shadow:0 0 10px var(--primary);
}

/* Nova Grid em estilo Launcher de Celular */
.grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); /* Elementos menores e mais compactos */
    gap: 16px;
    margin-top: 10px;
}

/* Card Estilo App */
.card{
    display: flex;
    flex-direction: column; /* Alinha o ícone em cima e texto embaixo */
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    padding: 10px 6px;
    background: var(--card);
    border-radius: 16px; /* Bordas mais arredondadas estilo app */
    border: 1px solid rgba(115,140,155,.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    will-change: transform; /* Avisa o navegador para otimizar a animação */
}

.card:hover{
    transform: scale(1.08); /* Efeito de zoom suave ao invés de mover para cima */
    box-shadow: 0 0 15px rgba(143,184,209,.4);
}

/* Ícone do App */
.card img{
    width: 42px; /* Tamanho perfeito para visualização em grid menor */
    height: 42px;
    border-radius: 10px; /* Deixa o favicon com cantos arredondados de app */
    margin-bottom: 8px;
    background-color: rgba(255, 255, 255, 0.1); /* Fundo sutil caso o favicon seja transparente */
    object-fit: contain;
}

/* Nome do App Pequeno Embaixo */
.card span{
    font-size: 0.7rem; /* Texto pequeno */
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2; /* Limita a no máximo 2 linhas para não quebrar a grid */
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
}

footer{
    text-align:center;
    margin-top:30px;
    opacity:.8;
    font-size:.8rem;
}
</style>
</head>
<body>

<header>
    <h1>Atalhos</h1>

    <form action="https://www.google.com/search" method="GET" target="_blank">
        <input
            id="google-search"
            class="search-input"
            name="q"
            placeholder="Pesquisar no Google..."
            autocomplete="off">
    </form>

    <input
        id="search"
        class="search-input"
        placeholder="Filtrar atalhos..."
        autocomplete="off">
</header>

<details open>
    <summary>Todos os Links</summary>
    <div class="grid" id="links"></div>
</details>

<script>
const data=[
["PlaySearch","https://playsearch.kaki87.net/"],
["Vivo Ads","https://internetgratis.vivo.com.br/#/home"],
["Email Temporário","https://www.invertexto.com/gerador-email-temporario"],
["YouTube","https://m.youtube.com/"],
["Invidious","https://inv.nadeko.net/feed/popular"],
["TinEye","https://tineye.com/"],
["MyInstants","https://www.myinstants.com/pt/index/br/"],
["Venice AI","https://venice.ai/"],
["VirusTotal","https://www.virustotal.com/gui/home/upload"],
["StackEdit","https://stackedit.io/"],
["Sitting on Clouds","https://www.sittingonclouds.net/"],
["Reddit","https://www.reddit.com/"],
["Steam Workshop","https://steamcommunity.com/profiles/76561198767980433/myworkshopfiles?browsefilter=mysubscriptions"],
["Virgil Search APK","https://virgil.samidy.com/Mobile/#gsc.tab=0&gsc.sort=&gsc.q=Cat%20quest"],
["RapidSave","https://rapidsave.com/"],
["SaveInsta","https://saveclip.app/pt"],
["FDown","https://fdown.net/pt/download.php"],
["Pinterest","https://www.pinterest.com/"],
["Facebook","https://m.facebook.com/"],
["Photopea","https://www.photopea.com/"],
["Instagram","https://www.instagram.com/"],
["F-Droid","https://f-droid.org/pt_BR/packages/"],
["PinDown","https://pindown.io/pt1"],
["Pirataria Megathread","https://pirataria.link/"],
["4Devs","https://www.4devs.com.br/"],
["DeviantArt","https://www.deviantart.com/"],
["KRESKA.art","https://kreska.art/"],
["RetroPad Editor","https://valent-in.github.io/retropad-editor/"],
["Serebii Spindex","https://serebii.net/spindex/"],
["Calculadora data","https://www.supercalendario.com.br/calculadora-data"],
["Arakaptel","https://github.com/Arakaptel/Nomen-deest/"]
];

const container = document.getElementById("links");

function render(filter = ""){
    container.innerHTML = "";

    data
    .filter(([name]) =>
        name.toLowerCase().includes(filter.toLowerCase())
    )
    .forEach(([name,url]) => {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.className = "card";

        // Adicionado loading="lazy" para performance e melhorias no favicon
        a.innerHTML = `
            <img src="https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64" loading="lazy" alt="">
            <span>${name}</span>
        `;

        container.appendChild(a);
    });
}

render();

document
.getElementById("search")
.addEventListener("input", e => {
    render(e.target.value);
});
</script>

</body>
</html>
